<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco di Natale per Federica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎡 Ruota della Fortuna</h1>
            <div class="subtitle">Sicignano Edition</div>
        </header>

        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="setup-layout">
                <img src="gerryfoto.jpg" alt="Host" class="host-photo">
                <!-- Multiplayer Mode -->
                <div class="mode-card" id="free-mode-card">
                    <h2>🎮 Ruota della Fortuna</h2>
                    <p>Gioca con gli amici! Frase generata dall'AI.</p>

                    <!-- Step 1: Player Count -->
                    <div id="setup-step-1" class="setup-step">
                        <div class="form-group">
                            <label for="player-count-input">Quanti giocatori?</label>
                            <input type="number" id="player-count-input" min="1" max="10" value="2"
                                class="player-count-input">
                        </div>
                        <button id="next-step-btn" class="btn-primary">
                            Avanti ➡️
                        </button>
                    </div>

                    <!-- Step 2: Player Names -->
                    <div id="setup-step-2" class="setup-step" style="display: none;">
                        <div class="form-group">
                            <label>Inserisci i nomi:</label>
                            <div id="player-names-container">
                                <!-- Injected via JS -->
                            </div>
                        </div>
                        <button id="start-game-btn" class="btn-primary">
                            Inizia Partita 🚀
                        </button>
                        <button id="back-step-btn" class="btn-secondary btn-small">
                            ← Indietro
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <!-- Popup Overlay -->
            <div id="modal-overlay" class="modal-overlay" style="display: none;">
                <div id="popup-message" class="popup-message" style="display: none;"></div>
            </div>

            <!-- Manche Indicator -->
            <div class="manche-indicator">
                <span>MANCHE</span>
                <span id="manche-number" class="manche-number">1</span>
                <span>/ 5</span>
            </div>

            <!-- Main Game Layout -->
            <div class="game-main-layout">
                <!-- Left: Players Sidebar -->
                <aside class="players-sidebar">
                    <h3>GIOCATORI</h3>
                    <ul id="players-list" class="players-list">
                        <!-- Injected via JS -->
                    </ul>
                </aside>

                <!-- Center: Board -->
                <div class="board-area">
                    <!-- Hint -->
                    <div id="hint-display" class="hint-display">
                        <span class="hint-label">Categoria:</span>
                        <span id="hint-text">...</span>
                    </div>
                    <!-- Board -->
                    <div class="board-container">
                        <div class="board-oval">
                            <div class="board-frame">
                                <div class="game-board-inner">
                                    <div id="game-board" class="game-board">
                                        <!-- Tiles generated by JS -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Spin Button Center -->
                    <div class="spin-container-centered">
                        <button id="spin-btn" class="btn-spin">🎡 GIRA LA RUOTA</button>
                    </div>
                </div>

                <!-- Right: Wheel Value Display -->
                <aside class="wheel-value-sidebar">
                    <div class="wheel-value-display" id="wheel-value-display">
                        <span class="value-label">VALORE</span>
                        <span id="current-wheel-value" class="wheel-value">-</span>
                    </div>
                </aside>
            </div>

            <!-- Interazioni Inferiori Affiancate -->
            <div class="game-actions-row">
                <!-- Letters Controls -->
                <div class="letters-controls">
                    <!-- Consonant Input -->
                    <div class="control-group" id="consonant-group">
                        <label>Chiama una CONSONANTE:</label>
                        <div class="input-group">
                            <input type="text" id="consonant-input" maxlength="1" autocomplete="off" disabled>
                            <button id="consonant-btn" class="btn-action" disabled>CHIAMA</button>
                        </div>
                    </div>

                    <!-- Vowel Input -->
                    <div class="control-group" id="vowel-group">
                        <label>Compra una VOCALE (€1000):</label>
                        <div class="input-group">
                            <input type="text" id="vowel-input" maxlength="1" autocomplete="off" disabled>
                            <button id="vowel-btn" class="btn-action btn-vowel" disabled>COMPRA</button>
                        </div>
                    </div>

                    <!-- Message Display -->
                    <div id="message-display" class="message-display"></div>
                </div>

                <!-- Solve Section (A destra) -->
                <div class="solve-section-card">
                    <div class="control-group" id="solve-group">
                        <label>Risolvi la frase:</label>
                        <div class="input-group full-width">
                            <input type="text" id="solution-input" placeholder="Scrivi la soluzione..."
                                autocomplete="off">
                            <button id="solve-btn" class="btn-solve">RISOLVI</button>
                            <button id="pass-btn" class="btn-pass" style="display: none;">PASSA</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- New Game Button -->
            <div class="game-footer">
                <button id="new-game-btn" class="btn-secondary">🔄 Nuovo Gioco</button>
            </div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="screen">
            <div class="win-card">
                <div class="confetti">🎉</div>
                <h2 id="win-title">HAI VINTO!</h2>

                <div id="final-image-container" class="final-image-container" style="display: none;">
                    <img id="final-image" src="" alt="Regalo Finale">
                    <p class="final-caption">Indovina la città?</p>
                </div>

                <div class="win-phrase" id="win-phrase">FRASE</div>

                <p id="win-message" class="win-message">Livello completato!</p>

                <button id="next-level-btn" class="btn-primary">
                    Prossimo Livello ➡️
                </button>
            </div>
        </div>

        <!-- Wheel Full Screen Overlay -->
        <div id="wheel-overlay" class="wheel-overlay">
            <div class="wheel-container">
                <canvas id="wheel-canvas" width="1200" height="1200"></canvas>
                <div class="wheel-pointer">▼</div>
            </div>
        </div>
    </div>

    <script src="puzzles.js"></script>
    <script src="game.js"></script>
</body>

</html>
